<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Zengin Showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&family=Schibsted+Grotesk:wght@400;500;600&family=Archivo:wght@700;800&family=Archivo+Black&family=Public+Sans:wght@400;600;700&display=block" rel="stylesheet" />
<style>
  :root {
    --ivory: #F4F1E9; --ivory-2: #EBE7DC; --ivory-3: #DCD8CC;
    --ink: #20231F; --ink-2: #2B2E29; --ink-3: #171916; --ink-line: #363933;
    --verm: #D7472F; --verm-hi: #FC694F; --verm-soft: #4A1D14;
    --olive: #727B60; --olive-hi: #A0A98D; --olive-soft: #2E3328;
    --muted: #8A8C84;
    --display: "Inter Tight", "Inter", sans-serif;
    --sans: "Inter", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0c0d0b; overflow: hidden; }
  body { display: grid; place-items: center; height: 100vh; }
  #viewport { width: 1920px; height: 1080px; position: relative; overflow: hidden; transform-origin: 0 0; }
  body.render #viewport { position: absolute; left: 0; top: 0; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--ink); font-family: var(--sans); }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .scene.on { display: block; }
  .abs { position: absolute; }
  .dark { background: var(--ink); color: var(--ivory); }
  .light { background: var(--ivory); color: var(--ink); }
  .mono { font-family: var(--mono); }
  .disp { font-family: var(--display); }
  .mask { overflow: hidden; display: block; padding-bottom: .16em; margin-bottom: -.16em; }
  .mask > span { display: inline-block; will-change: transform; }

  /* HUD: spec-sheet framing that sits over every scene */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 50; font-family: var(--mono); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; transition: none; }
  #hud .c { position: absolute; width: 28px; height: 28px; border-color: currentColor; border-style: solid; border-width: 0; opacity: .55; }
  #hud .tl { left: 40px; top: 40px; border-left-width: 2px; border-top-width: 2px; }
  #hud .tr { right: 40px; top: 40px; border-right-width: 2px; border-top-width: 2px; }
  #hud .bl { left: 40px; bottom: 40px; border-left-width: 2px; border-bottom-width: 2px; }
  #hud .br { right: 40px; bottom: 40px; border-right-width: 2px; border-bottom-width: 2px; }
  #hud .lab { position: absolute; opacity: .7; white-space: nowrap; }
  #hud .bar { position: absolute; left: 84px; right: 84px; bottom: 52px; height: 2px; background: currentColor; opacity: .14; }
  #hud .fill { position: absolute; left: 84px; bottom: 52px; height: 2px; background: var(--verm); }
  #hud .ticks { position: absolute; left: 84px; right: 84px; bottom: 48px; height: 10px; }
  #hud .ticks i { position: absolute; top: 0; width: 2px; height: 10px; background: currentColor; opacity: .35; }

  #wipe { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
  #wipe div { position: absolute; top: -20%; height: 140%; width: 150%; left: 0; transform-origin: 50% 50%; }
  #grain { position: absolute; inset: 0; z-index: 60; pointer-events: none; opacity: .07; mix-blend-mode: overlay; }
  #vignette { position: absolute; inset: 0; z-index: 59; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.28) 100%); }

  /* grid lines */
  .gridlines { position: absolute; inset: 0; }
  .gridlines i { position: absolute; background: currentColor; opacity: .09; }

  /* Code editor */
  .editor { position: absolute; background: var(--ink-3); border: 2px solid var(--ink-line); }
  .editor .chrome { height: 56px; border-bottom: 2px solid var(--ink-line); display: flex; align-items: center; gap: 18px; padding: 0 22px; font-family: var(--mono); font-size: 17px; color: var(--muted); letter-spacing: .02em; }
  .editor .chrome b { color: var(--ivory); font-weight: 500; }
  .editor .dots { display: flex; gap: 8px; }
  .editor .dots i { width: 12px; height: 12px; background: var(--ink-line); display: block; }
  .code { font-family: var(--mono); font-size: 25px; line-height: 41px; padding: 22px 0; white-space: pre; color: #D9D6CC; }
  .code .ln { display: inline-block; width: 74px; text-align: right; padding-right: 26px; color: #4F524A; }
  .code .kw { color: #F2A08D; }
  .code .str { color: #C9D0B8; }
  .code .tag { color: #F4F1E9; font-weight: 700; }
  .code .attr { color: #B5B3AA; }
  .code .pun { color: #7F7E76; }
  .code .num { color: #E7C48A; }
  .code .v { position: relative; }
  .code .v.bad { color: #FFB5A6; background: rgba(252,105,79,.18); box-shadow: inset 0 -3px 0 var(--verm-hi); }
  .code .v.fix { color: #DDE6C8; background: rgba(160,169,141,.22); box-shadow: inset 0 -3px 0 var(--olive-hi); }
  .code .cursor { display: inline-block; width: 13px; height: 30px; background: var(--verm-hi); vertical-align: -6px; }
  .line { position: relative; }
  .line .flag { position: absolute; left: calc(100% + 0px); }

  .vcard { position: absolute; width: 560px; background: var(--ink-2); border-left: 6px solid var(--verm-hi); padding: 16px 22px 16px 22px; font-family: var(--mono); font-size: 18px; color: #D9D6CC; }
  .vcard .r { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .vcard .rule { color: var(--verm-hi); font-weight: 700; font-size: 20px; }
  .vcard .ln2 { color: #7F7E76; }
  .vcard .fx { margin-top: 8px; color: #B5B3AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vcard .fx em { font-style: normal; color: #DDE6C8; }
  .vcard .conf { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border: 1.5px solid currentColor; color: #B5B3AA; }
  .vcard.ok { border-left-color: var(--olive-hi); }
  .vcard.ok .rule { color: var(--olive-hi); }

  /* surfaces */
  .node { position: absolute; background: var(--ivory); border: 3px solid var(--ink); padding: 26px 30px; width: 470px; }
  .node .k { font-family: var(--mono); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--verm); }
  .node h3 { font-family: var(--display); font-size: 50px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; line-height: 1; }
  .node p { font-family: var(--mono); font-size: 19px; margin-top: 16px; color: #5B5E57; white-space: nowrap; }
  .node p b { color: var(--ink); font-weight: 500; }

  /* rules */
  .rrow { position: absolute; left: 0; right: 0; height: 104px; display: flex; align-items: center; border-top: 2px solid var(--ink-line); padding: 0 120px; }
  .rrow .ix { font-family: var(--mono); font-size: 22px; color: var(--muted); width: 90px; }
  .rrow .nm { font-family: var(--display); font-size: 70px; font-weight: 800; letter-spacing: -.03em; flex: 1; }
  .rrow .ex { font-family: var(--mono); font-size: 21px; color: #B5B3AA; width: 560px; }
  .rrow .ex s { color: #FFB5A6; text-decoration-color: var(--verm-hi); text-decoration-thickness: 2px; }
  .rrow .ex em { font-style: normal; color: #C9D0B8; }
  .rrow .fam { font-family: var(--mono); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; border: 2px solid currentColor; padding: 5px 12px; width: 190px; text-align: center; margin-right: 40px; }

  /* system tiles: every tile reads theme vars from #sys */
  #sys { --radius: 6px; --bw: 1.5px; --shadow: 0 1px 2px rgba(0,0,0,.06); }
  .tile { position: absolute; background: var(--t-raised); border: var(--bw) solid var(--t-border); border-radius: calc(var(--radius) * 1.6); box-shadow: var(--shadow); padding: 30px; color: var(--t-text); font-family: var(--t-sans); overflow: hidden; }
  .tile .cap { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--t-muted); margin-bottom: 18px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 54px; padding: 0 26px; font-size: 20px; font-weight: 600; border-radius: var(--radius); border: var(--bw) solid transparent; font-family: var(--t-sans); white-space: nowrap; }
  .btn.solid { background: var(--t-primary); color: var(--t-on-primary); box-shadow: var(--shadow); }
  .btn.soft { background: var(--t-soft); color: var(--t-soft-fg); }
  .btn.ghost { color: var(--t-text); border-color: var(--t-border); }
  .badge { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; font-size: 16px; font-weight: 600; border-radius: calc(var(--radius) * .8); }
  .field { height: 56px; border: var(--bw) solid var(--t-border); border-radius: var(--radius); background: var(--t-surface); display: flex; align-items: center; padding: 0 18px; font-size: 20px; color: var(--t-text); }
  .sw { width: 64px; height: 36px; border-radius: 999px; background: var(--t-border); position: relative; flex: none; }
  .sw i { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 999px; background: var(--t-surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .prog { height: 12px; background: var(--t-sunken); border-radius: 999px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--t-primary); border-radius: 999px; }
  .tdisp { font-family: var(--t-display); }
  .kcol { background: var(--t-sunken); border-radius: var(--radius); padding: 12px; min-height: 150px; }

  /* ---- portrait (9:16): the same film, re-laid for a phone held upright ---- */
  body.pt .code { font-size: 21px; line-height: 36px; }
  body.pt .code .ln { width: 58px; padding-right: 20px; }
  body.pt .code .cursor { width: 11px; height: 26px; }
  body.pt .vcard { width: 488px; padding: 12px 16px; font-size: 15px; }
  body.pt .vcard .rule { font-size: 17px; }
  body.pt .vcard .conf { font-size: 11px; padding: 2px 6px; }
  body.pt .vcard .fx { margin-top: 6px; }
  body.pt .node { width: 480px; padding: 22px 26px; }
  body.pt .node h3 { font-size: 46px; }
  body.pt .node p { font-size: 18px; }
  body.pt .rrow { height: 150px; flex-wrap: wrap; align-content: center; padding: 0 60px; row-gap: 10px; }
  body.pt .rrow .ix { width: 70px; font-size: 20px; }
  body.pt .rrow .nm { font-size: 60px; flex: 1 1 800px; }
  body.pt .rrow .fam { width: auto; margin: 0 24px 0 70px; font-size: 13px; padding: 4px 10px; }
  body.pt .rrow .ex { width: auto; font-size: 19px; }
  body.pt .tile { padding: 22px; }
  body.pt .tile .cap { margin-bottom: 14px; }
  body.pt .btn { height: 50px; padding: 0 18px; font-size: 18px; }
  body.pt .kcol { min-height: 108px; padding: 10px; }
  body.pt .kcard { font-size: 15px; padding: 10px 12px; }
  body.pt .term { font-size: 23px; line-height: 40px; }
  .kcard { background: var(--t-raised); border: var(--bw) solid var(--t-border); border-radius: var(--radius); padding: 12px 14px; font-size: 16px; margin-top: 10px; box-shadow: var(--shadow); }

  .term { font-family: var(--mono); font-size: 28px; line-height: 46px; color: #D9D6CC; white-space: pre; }
  .term .p { color: var(--verm-hi); }
  .term .ok { color: var(--olive-hi); }
  .term .dim { color: #7F7E76; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage"></div>
  <div id="wipe"></div>
  <div id="vignette"></div>
  <svg id="grain" width="1920" height="1080"><filter id="gf"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg>
  <div id="hud"></div>
</div>
<script>
/* ============================================================
   Zengin showreel. Every frame is a pure function of t (seconds):
   seek(t) paints the frame, so the renderer can step it exactly.
   120 BPM: one beat = 0.5s, one bar = 2s. Cuts land on beats.
   ============================================================ */
// ?portrait renders the 9:16 cut (1080x1920). Instagram draws its own chrome over the top ~250px, the
// bottom ~420px and a right-hand column, so everything that has to be read sits inside SAFE.
const PT = new URLSearchParams(location.search).has('portrait');
if (PT) document.body.classList.add('pt');
const W = PT ? 1080 : 1920, H = PT ? 1920 : 1080, DUR = 45, BPM = 120, BEAT = 60 / BPM;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  lin: x => x,
  o2: x => 1 - (1 - x) * (1 - x),
  o3: x => 1 - Math.pow(1 - x, 3),
  o4: x => 1 - Math.pow(1 - x, 4),
  o5: x => 1 - Math.pow(1 - x, 5),
  i3: x => x * x * x,
  io3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  oExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  iExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  ioExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  oBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  oElastic: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
const h = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const css = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const stage = document.getElementById('stage');
css(document.getElementById('viewport'), { width: W + 'px', height: H + 'px' });
document.getElementById('grain').setAttribute('width', W); document.getElementById('grain').setAttribute('height', H);
// deterministic pseudo-random
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
// beat pulse: 1 on the beat decaying to 0
const pulse = (t, from = 0, k = 7) => { if (t < from) return 0; const ph = ((t - from) % BEAT) / BEAT; return Math.exp(-ph * k); };

const MARK = [
  "12,6 62,6 54,20 4,20",
  "44,22 58,22 20,42 6,42",
  "10,44 60,44 52,58 2,58",
];
function markSVG(parent, size, color) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 64 64'); svg.setAttribute('width', size); svg.setAttribute('height', size);
  svg.style.overflow = 'visible';
  const polys = MARK.map(pts => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon'); p.setAttribute('points', pts); p.setAttribute('fill', color); svg.appendChild(p); p.style.transformBox = 'fill-box'; p.style.transformOrigin = '50% 50%'; return p; });
  parent.appendChild(svg);
  return { svg, polys };
}
function maskLine(parent, text, cls) {
  const m = h('div', 'mask ' + (cls || ''), parent);
  const s = h('span', '', m, text);
  return s;
}
function gridLines(parent, cols, rows) {
  const g = h('div', 'gridlines', parent);
  const vs = [], hs = [];
  for (let i = 1; i < cols; i++) { const l = h('i', '', g); css(l, { left: (i * W / cols) + 'px', top: 0, width: '1px', height: '100%' }); vs.push(l); }
  for (let i = 1; i < rows; i++) { const l = h('i', '', g); css(l, { top: (i * H / rows) + 'px', left: 0, height: '1px', width: '100%' }); hs.push(l); }
  return { g, vs, hs };
}

/* ============================ SCENES ============================ */
const scenes = [];
function scene(name, a, b, bg, build) {
  const el = h('div', 'scene ' + bg, stage);
  const s = { name, a, b, bg, el };
  s.update = build(el, s);
  scenes.push(s);
  return s;
}

/* ---------- 01 · Mark: three modules assemble ---------- */
scene('The mark', 0, 4, 'dark', (el) => {
  const grid = gridLines(el, 12, 7);
  const wrap = h('div', 'abs', el); css(wrap, { left: '0', top: '0', width: W + 'px', height: H + 'px' });
  const markBox = h('div', 'abs', wrap); css(markBox, { left: (W / 2 - 230) + 'px', top: (H / 2 - 230) + 'px', width: '460px', height: '460px' });
  const m = markSVG(markBox, 460, '#D7472F');
  const word = h('div', 'abs disp', wrap); css(word, { left: '0', top: (PT ? 980 : H / 2 - 150) + 'px', fontSize: PT ? '240px' : '260px', fontWeight: 800, letterSpacing: '-.045em', lineHeight: '1', whiteSpace: 'nowrap' });
  const letters = [...'Zengin'].map(ch => { const m = h('span', 'mask', word); css(m, { display: 'inline-block' }); const s = h('span', '', m, ch); css(s, { display: 'inline-block' }); return s; });
  const sub = h('div', 'abs mono', wrap); css(sub, { top: (PT ? 1290 : H / 2 + 150) + 'px', fontSize: PT ? '28px' : '26px', letterSpacing: '.14em', textTransform: 'uppercase', color: '#B5B3AA', whiteSpace: 'nowrap', lineHeight: '1.6' });
  sub.innerHTML = PT ? 'Authored systems <span style="color:#FC694F">/</span><br>for the age of coding agents' : 'Authored systems <span style="color:#FC694F">/</span> for the age of coding agents';
  if (PT) { css(word, { width: W + 'px', textAlign: 'center' }); css(sub, { width: W + 'px', textAlign: 'center' }); }
  const ring = h('div', 'abs', wrap); css(ring, { border: '2px solid #FC694F', borderRadius: '0' });
  return (t) => {
    // grid draws in
    grid.vs.forEach((l, i) => { const k = E.o3(P(t, .05 + i * .03, .7 + i * .03)); l.style.transform = `scaleY(${k})`; l.style.transformOrigin = i % 2 ? 'top' : 'bottom'; });
    grid.hs.forEach((l, i) => { const k = E.o3(P(t, .1 + i * .04, .8 + i * .04)); l.style.transform = `scaleX(${k})`; l.style.transformOrigin = i % 2 ? 'left' : 'right'; });
    // modules fly in on the beats 0.5 / 1.0 / 1.5
    const dirs = [[-900, -260, -40], [0, 700, 30], [900, 260, -40]];
    m.polys.forEach((p, i) => {
      const k = E.oExpo(P(t, .25 + i * .5, .75 + i * .5));
      const [dx, dy, r] = dirs[i];
      p.style.transform = `translate(${(1 - k) * dx / 7.2}px, ${(1 - k) * dy / 7.2}px) rotate(${(1 - k) * r}deg) scale(${lerp(.4, 1, k)})`;
      p.style.opacity = P(t, .25 + i * .5, .35 + i * .5);
    });
    // punch on the lock-in at 1.75, then slide left to make room for the wordmark
    const punch = 1 + .08 * Math.exp(-Math.max(0, t - 1.75) * 9) * (t > 1.75 ? 1 : 0);
    const slide = E.io3(P(t, 2.0, 2.6));
    const markX = PT ? W / 2 - 230 : lerp(W / 2 - 230, 250, slide), markY = PT ? lerp(H / 2 - 230, 420, slide) : H / 2 - 230, markS = lerp(1, PT ? .86 : .74, slide);
    css(markBox, { left: markX + 'px', top: markY + 'px', transform: `scale(${markS * punch})` });
    letters.forEach((s, i) => { const k = E.o4(P(t, 2.25 + i * .06, 2.85 + i * .06)); s.style.transform = `translateY(${(1 - k) * 110}%)`; });
    if (!PT) { word.style.left = '720px'; sub.style.left = '728px'; }
    const ks = E.o3(P(t, 2.9, 3.4)); sub.style.opacity = ks; sub.style.transform = PT ? `translateY(${(1 - ks) * 24}px)` : `translateX(${(1 - ks) * -30}px)`;
    // shock ring when the mark locks
    const kr = P(t, 1.75, 2.35);
    css(ring, { left: (W / 2 - 230 - kr * 200) + 'px', top: (H / 2 - 230 - kr * 200) + 'px', width: (460 + kr * 400) + 'px', height: (460 + kr * 400) + 'px', opacity: kr > 0 && kr < 1 ? (1 - kr) : 0 });
    // slow drift out
    wrap.style.transform = `scale(${1 + .05 * P(t, 2, 4)})`;
  };
});

/* ---------- 02 · The problem, in type ---------- */
scene('The problem', 4, 8, 'light', (el) => {
  const A = h('div', 'abs disp', el); css(A, { left: PT ? '80px' : '150px', top: PT ? '470px' : '170px', fontSize: PT ? '200px' : '210px', fontWeight: 800, letterSpacing: '-.05em', lineHeight: '.98' });
  const a1 = maskLine(A, PT ? 'Agents<br>write' : 'Agents write'), a2 = maskLine(A, 'your UI.'), a3 = maskLine(A, 'Fast.');
  a3.style.color = '#D7472F';
  const B = h('div', 'abs disp', el); css(B, { left: PT ? '80px' : '150px', top: PT ? '520px' : '250px', fontSize: PT ? '176px' : '210px', fontWeight: 800, letterSpacing: '-.05em', lineHeight: '.98' });
  const b1 = maskLine(B, PT ? 'Then it<br>drifts' : 'Then it drifts'), b2 = maskLine(B, PT ? 'off your<br>system.' : 'off your system.');
  const strike = h('div', 'abs', el); css(strike, { height: '22px', background: '#D7472F', left: '140px', top: '540px', transformOrigin: 'left' });

  foot.innerHTML = '<span style="color:#F4F1E9;border:2px solid #4A4D45;padding:12px 22px">npm create zengin@latest</span>' + (PT ? '<div style="margin-top:44px">zengin.timurtek.com</div>' : '<span style="margin:0 28px;color:#4A4D45">/</span>zengin.timurtek.com');
  const black = h('div', 'abs', el); css(black, { left: 0, top: 0, width: W + 'px', height: H + 'px', background: '#000' });
  return (t) => {
    flash.style.opacity = 1 - E.o3(P(t, 41.0, 41.35));
    m.polys.forEach((p, i) => {
      const k = E.oExpo(P(t, 41.05 + i * .14, 41.6 + i * .14));
      p.style.transform = `translateX(${(1 - k) * (i === 1 ? 0 : (i ? 60 : -60))}px) translateY(${(1 - k) * (i === 1 ? 50 : 0)}px) scaleX(${lerp(0, 1, k)})`;
    });
    markBox.style.transform = `scale(${1 + .025 * pulse(t, 42, 5) * (t < 44 ? 1 : 0)})`;
    [w1, w2].forEach((s, i) => { const k = E.o5(P(t, 41.6 + i * .3, 42.2 + i * .3)); s.style.transform = `translateY(${(1 - k) * 105}%)`; });
    foot.style.opacity = E.o3(P(t, 42.6, 43.1)); foot.style.transform = `translateY(${(1 - E.o3(P(t, 42.6, 43.1))) * 20}px)`;
    black.style.opacity = E.i3(P(t, 44.35, 45));
  };
});

/* ============================ WIPES ============================ */
// Two skewed slabs cross the frame at each cut: the vermilion one leads, the next scene's ground follows,
// covers the frame at the cut, and the scene underneath takes over. The slant is the Z's own diagonal.
const CUTS = [[4, '#F4F1E9'], [8, '#20231F'], [20, '#F4F1E9'], [26, '#20231F'], [30, '#EBE7DC'], [36, '#20231F']];
const wipeEl = document.getElementById('wipe');
const slabA = h('div', '', wipeEl), slabB = h('div', '', wipeEl);
slabA.style.background = '#D7472F';
const SW = W + 0.7 * H, OFF = SW + 0.3 * H;
[slabA, slabB].forEach((sl) => css(sl, { width: SW + 'px', left: '0' }));
function wipes(t) {
  let on = false;
  for (const [c, bg] of CUTS) {
    if (t >= c - .32 && t < c + .3) {
      on = true;
      slabB.style.background = bg;
      // A: -170% → +170% over [c-.32, c+.3]; B trails it and holds full cover at the cut
      const ka = E.io3(P(t, c - .32, c + .3));
      const xa = lerp(-OFF, W + 0.3 * H, ka);
      slabA.style.transform = `translateX(${xa}px) skewX(-28deg)`;
      const kb = E.i3(P(t, c - .26, c));
      const xb = lerp(-OFF, -0.3 * H - 20, kb);
      slabB.style.transform = `translateX(${xb}px) skewX(-28deg)`;
      slabB.style.display = t < c ? 'block' : 'none';
    }
  }
  wipeEl.style.display = on ? 'block' : 'none';
}

/* ============================ HUD ============================ */
const hud = document.getElementById('hud');
['tl', 'tr', 'bl', 'br'].forEach(c => h('div', 'c ' + c, hud));
const hTL = h('div', 'lab', hud); css(hTL, { left: '84px', top: '46px' });
const hTR = h('div', 'lab', hud); css(hTR, { right: '84px', top: '46px' });
const hBL = h('div', 'lab', hud); css(hBL, { left: '84px', bottom: '66px' });
const hBR = h('div', 'lab', hud); css(hBR, { right: '84px', bottom: '66px' });
h('div', 'bar', hud); const hFill = h('div', 'fill', hud);
const ticks = h('div', 'ticks', hud);
scenes.forEach(s => { const i = h('i', '', ticks); i.style.left = (s.a / DUR * 100) + '%'; });
hTL.innerHTML = '<span style="color:#D7472F">■</span>&nbsp; Zengin · showreel';
const tc = (t) => { const f = Math.floor(t * 30) % 30, s = Math.floor(t) % 60, m = Math.floor(t / 60); return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`; };

/* ============================ SEEK ============================ */
const HUD_BG = { dark: '#F4F1E9', light: '#20231F' };
function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  let cur = scenes[0];
  scenes.forEach(s => { const on = t >= s.a && t < s.b; s.el.classList.toggle('on', on); if (on) { cur = s; s.update(t); } });
  wipes(t);
  // HUD takes the scene's ink; the end card and the opening hide it
  let hudCol = HUD_BG[cur.bg];
  if (cur.name === 'The system') hudCol = t >= 33.5 && t < 34.5 ? '#F4F1E9' : '#20231F';
  if (cur.name === 'Seven rules' && t >= 28.4) hudCol = '#20231F';
  if (cur.name === 'The catch' && t >= 17.9) hudCol = '#F4F1E9';
  hud.style.color = hudCol;
  const hudOn = t > .6 && t < 41;
  hud.style.opacity = hudOn ? Math.min(P(t, .6, 1.2), 1 - P(t, 40.7, 41)) : 0;
  const idx = scenes.indexOf(cur) + 1;
  hTR.textContent = `${String(idx).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')} · ${cur.name}`;
  hBL.textContent = 'zengin.timurtek.com';
  hBR.textContent = tc(t);
  hFill.style.width = `calc((100% - 168px) * ${t / DUR})`;
  document.getElementById('turb').setAttribute('seed', 1 + (Math.floor(t * 30) % 12));
}
window.seek = seek; window.DUR = DUR;

/* ============================ PLAYER ============================ */
const render = new URLSearchParams(location.search).has('render');
if (render) document.body.classList.add('render');
function fit() { if (render) return; const s = Math.min(innerWidth / W, innerHeight / H); const v = document.getElementById('viewport'); v.style.transform = `scale(${s})`; v.style.position = 'absolute'; v.style.left = ((innerWidth - W * s) / 2) + 'px'; v.style.top = ((innerHeight - H * s) / 2) + 'px'; }
addEventListener('resize', fit); fit();
window.ready = document.fonts.ready.then(() => { seek(0); return true; });
if (!render) {
  let t0 = null, paused = false, pt = 0;
  const q = new URLSearchParams(location.search).get('t'); if (q) pt = +q;
  const loop = (now) => { if (t0 == null) t0 = now - pt * 1000; if (!paused) { pt = ((now - t0) / 1000) % DUR; seek(pt); } requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
  addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; t0 = performance.now() - pt * 1000; } if (e.code === 'ArrowRight') { pt = Math.min(DUR, pt + 1); t0 = performance.now() - pt * 1000; seek(pt); } if (e.code === 'ArrowLeft') { pt = Math.max(0, pt - 1); t0 = performance.now() - pt * 1000; seek(pt); } });
}
</script>
