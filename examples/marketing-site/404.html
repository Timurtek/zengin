<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='%23D3442C'%3E%3Cpolygon points='12,6 62,6 54,20 4,20'/%3E%3Cpolygon points='44,22 58,22 20,42 6,42'/%3E%3Cpolygon points='10,44 60,44 52,58 2,58'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // A saved theme, else the system preference. The other pages settle the preference in React; this one
      // runs no app, so it settles it here.
      var t = null;
      try {
        t = localStorage.getItem("zengin-theme");
      } catch (e) {}
      document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/site/not-found.tsx"></script>
  </body>
