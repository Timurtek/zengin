    <title>Why Zengin — a design system a machine can hold you to</title>
    <meta
      name="description"
      content="Component libraries own your components, shadcn/ui hands you the source, lint plugins check generic rules. Zengin is the one that writes your system's rules down in a form a machine can check, and checks every edit against them as it happens."

    <script>
      // Apply a saved theme before first paint; without one the system preference decides.
      try {
        var t = localStorage.getItem("zengin-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
