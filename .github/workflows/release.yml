name: release
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write        # the action commits version bumps and creates the release PR
  pull-requests: write
  id-token: write        # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # With pending changesets: opens or updates the "Version Packages" PR.
      # With none pending (that PR was just merged): publishes whatever is unpublished.
      # v2 for Changesets CLI v3. v1 found what was published by reading the "New tag:" lines the v3 CLI no
      # longer prints, so it saw nothing published and pushed no tags and created no GitHub releases (npm still
      # got the packages: the CLI publishes those). v2 reads the CLI's output file instead. npm auth is the
      # .npmrc setup-node writes for registry-url, read with NODE_AUTH_TOKEN; v2 no longer writes one from NPM_TOKEN.
      - name: version or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "Version packages"
          pr-title: "Version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance needs a public source repository, which this is since 2026-09-13: npm records
          # the workflow and commit each package was built from, and shows it on the package page.
          NPM_CONFIG_PROVENANCE: "true"
