name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # The engine checks its own fixture projects and annotates the PR, as a consumer would.
      - name: zengin on the plain-css fixture
        run: pnpm exec zengin check --format github --fail-on never
        working-directory: packages/engine/test/fixtures/project-css
